name: Test PMD action with no matching files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          path: nonexistent-path/pmd-report-does-not-exist.xml
          name: PMD
          title: PMD Source Code Analyzer report
          fail-on-violation: false

      - name: Assert action succeeded (no files found is a warning, not an error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed when no files are found, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action succeeded with a warning when no report files were found"
